plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    mods { "imgprev" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

// In-game tests in src/gametest: `./gradlew runClientGameTest` drives a real client (not part of `build`).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "imgprev-gametest"
        enableGameTests = false
    }
}
// `./gradlew runClientGameTest -Poffline` skips the checks that need the live image sites.
if (providers.gradleProperty("offline").isPresent()) {
    loom.runs.matching { it.name == "clientGameTest" }.configureEach { vmArg "-Dimgprev.gametest.offline=true" }
}

repositories {
    maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"   // no mappings line on 26.x
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // WebP decoding, bundled inside the mod jar (jar-in-jar); `include` isn't transitive, so all six are listed.
    implementation "com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}"
    ["com.twelvemonkeys.imageio:imageio-webp", "com.twelvemonkeys.imageio:imageio-core", "com.twelvemonkeys.imageio:imageio-metadata",
     "com.twelvemonkeys.common:common-lang", "com.twelvemonkeys.common:common-io", "com.twelvemonkeys.common:common-image"].each {
        include "${it}:${twelvemonkeys_version}"
    }

    // Optional settings screen: players who want it install Mod Menu and Cloth Config; nothing is bundled.
    // localRuntime puts them in dev runs (and the in-game tests) only.
    ["com.terraformersmc:modmenu:${modmenu_version}", "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"].each {
        compileOnly(it) { transitive = false }
        localRuntime(it) { transitive = false }
    }
    // Cloth's colour field API names its Color class; Cloth Config ships this jar inside itself.
    compileOnly("me.shedaniel.cloth:basic-math:${cloth_basic_math_version}") { transitive = false }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"   // Gradle 9 no longer supplies it; version from the JUnit BOM
}

// token/ and site/ live in the client source set; let the pure-Java tests see them.
sourceSets.test {
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
}

// `./gradlew tokenVectors`: every corpus link as link → token → download URL, for ports of the token format to test against.
tasks.register("tokenVectors", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "io.github.cjwmdev.imgprev.token.TokenVectors"
    args layout.buildDirectory.file("token-vectors.tsv").get().asFile.path
}

// Fills "${version}" in fabric.mod.json.
processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") { expand "version": version }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
test { useJUnitPlatform() }
