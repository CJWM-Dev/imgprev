plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }

// One jar per Minecraft version, all from the same source: `-Pmc=26.3` builds for 26.3 (default: `mc` in
// gradle.properties), with the versions in versions/26.3.properties.
def mc = project.mc
def mcFile = file("versions/${mc}.properties")
if (!mcFile.isFile()) {
    throw new GradleException("No versions/${mc}.properties; there are: ${file('versions').list().collect { it - '.properties' }.sort().join(', ')}")
}
def mcProps = new Properties()
mcFile.withReader { mcProps.load(it) }
def mcv = { String key -> mcProps.getProperty(key) ?: { throw new GradleException("versions/${mc}.properties has no ${key}") }() }

version = "${project.mod_version}+${mc}"   // imgprev-1.1.2+26.2.jar, so each version's jar has its own name
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    mods { "imgprev" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
    // Separate dev-run folders, since each version's options.txt and worlds don't suit the other.
    runs.matching { it.name == "client" }.configureEach { runDir "run/${mc}" }
}

// The source uses 26.2's class names. 26.3 moved the GPU classes to com.mojang.renderpearl, with the same names and
// methods, so for a version whose properties say renderpearl=true the client code compiles from a copy whose
// imports use the new packages.
if (mcProps.getProperty("renderpearl") == "true") {
    def renames = [
        "com.mojang.blaze3d.GpuFormat;"              : "com.mojang.renderpearl.api.GpuFormat;",
        "com.mojang.blaze3d.systems.GpuDevice;"      : "com.mojang.renderpearl.api.device.GpuDevice;",
        "com.mojang.blaze3d.pipeline.RenderPipeline;": "com.mojang.renderpearl.api.pipeline.RenderPipeline;",
        "com.mojang.blaze3d.textures."               : "com.mojang.renderpearl.api.textures.",
    ]
    def clientSrc = sourceSets.client.java.srcDirs.toList()
    def renamed = tasks.register("renameGpuImports", Sync) {
        from clientSrc
        into layout.buildDirectory.dir("renderpearl/client")
        filter { String line -> line.startsWith("import ") ? renames.inject(line) { l, r -> l.replace(r.key, r.value) } : line }
    }
    sourceSets.client.java.srcDirs = [renamed]
}

// In-game tests in src/gametest: `./gradlew runClientGameTest` drives a real client (not part of `build`).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "imgprev-gametest"
        enableGameTests = false
    }
}
// `./gradlew runClientGameTest -Poffline` skips the checks that need the live image sites.
if (providers.gradleProperty("offline").isPresent()) {
    loom.runs.matching { it.name == "clientGameTest" }.configureEach { vmArg "-Dimgprev.gametest.offline=true" }
}

repositories {
    maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcv("minecraft_version")}"   // no mappings line on 26.x
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mcv("fabric_api_version")}"

    // WebP decoding, bundled inside the mod jar (jar-in-jar); `include` isn't transitive, so all six are listed.
    implementation "com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}"
    ["com.twelvemonkeys.imageio:imageio-webp", "com.twelvemonkeys.imageio:imageio-core", "com.twelvemonkeys.imageio:imageio-metadata",
     "com.twelvemonkeys.common:common-lang", "com.twelvemonkeys.common:common-io", "com.twelvemonkeys.common:common-image"].each {
        include "${it}:${twelvemonkeys_version}"
    }

    // Optional settings screen: players who want it install Mod Menu and Cloth Config; nothing is bundled.
    // localRuntime puts them in dev runs (and the in-game tests) only.
    ["com.terraformersmc:modmenu:${mcv("modmenu_version")}", "me.shedaniel.cloth:cloth-config-fabric:${mcv("cloth_config_version")}"].each {
        compileOnly(it) { transitive = false }
        localRuntime(it) { transitive = false }
    }
    // Cloth's colour field API names its Color class; Cloth Config ships this jar inside itself.
    compileOnly("me.shedaniel.cloth:basic-math:${cloth_basic_math_version}") { transitive = false }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"   // Gradle 9 no longer supplies it; version from the JUnit BOM
}

// token/ and site/ live in the client source set; let the pure-Java tests see them.
sourceSets.test {
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
}

// `./gradlew tokenVectors`: every corpus link as link → token → download URL, for ports of the token format to test against.
tasks.register("tokenVectors", JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "io.github.cjwmdev.imgprev.token.TokenVectors"
    args layout.buildDirectory.file("token-vectors.tsv").get().asFile.path
}

// Fills in fabric.mod.json: the mod version, and the Minecraft and Fabric API versions this jar is for.
processResources {
    def props = [version: project.version.toString(), minecraft: mc, fabric_api: mcv("fabric_api_version").split("\\+")[0]]
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
test { useJUnitPlatform() }
