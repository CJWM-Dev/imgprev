plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()
    mods { "imgprev" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

// In-game tests in src/gametest: `./gradlew runClientGameTest` drives a real client (not part of `build`).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "imgprev-gametest"
        enableGameTests = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"   // no mappings line on 26.x
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // WebP decoding, bundled inside the mod jar (jar-in-jar); `include` isn't transitive, so all six are listed.
    implementation "com.twelvemonkeys.imageio:imageio-webp:${twelvemonkeys_version}"
    ["com.twelvemonkeys.imageio:imageio-webp", "com.twelvemonkeys.imageio:imageio-core", "com.twelvemonkeys.imageio:imageio-metadata",
     "com.twelvemonkeys.common:common-lang", "com.twelvemonkeys.common:common-io", "com.twelvemonkeys.common:common-image"].each {
        include "${it}:${twelvemonkeys_version}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"   // Gradle 9 no longer supplies it; version from the JUnit BOM
}

// token/ and site/ live in the client source set; let the pure-Java tests see them.
sourceSets.test {
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
}

// Fills "${version}" in fabric.mod.json.
processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") { expand "version": version }
}

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
test { useJUnitPlatform() }
