# Builds the mod and runs the unit tests on every push and pull request; the jar is attached to each run.
# A push to main whose mod_version (gradle.properties) hasn't been released yet also publishes a GitHub release,
# so bumping the version is what makes a release.
# (The in-game tests need a display and the live sites, so they stay local: ./gradlew runClientGameTest.)

name: build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: setup gradle (caches Minecraft and dependencies between runs)
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and run unit tests
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: imgprev-jar
          path: build/libs/
      - name: capture test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: download the jar from the build job
        uses: actions/download-artifact@v8
        with:
          name: imgprev-jar
          path: build/libs/
      - name: publish a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
          else
            gh release create "v$version" "build/libs/imgprev-$version.jar" \
              --title "ImgPrev $version" --target "$GITHUB_SHA" --generate-notes
          fi
